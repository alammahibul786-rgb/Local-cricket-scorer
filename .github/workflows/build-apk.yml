
name: Build Local Cricket Scorer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project directory
        run: |
          ls -la
          find . -name settings.gradle.kts -o -name settings.gradle

      - name: Build Android APK
        run: gradle -p LocalCricketScorer assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Local-Cricket-Scorer-APK
          path: LocalCricketScorer/app/build/outputs/apk/debug/*.apk
